# Renders the Quarto site in docs/ and publishes it to GitHub Pages.
#
# Runs on every push to main that touches the site, its inputs or the Python environment, and can be started by
# hand from the Actions tab. The code runs on GitHub's runner, so nothing is rendered on a laptop and no secret is
# needed: the report only reads tables saved in studies/output_datasets/.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Publish report

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "studies/output_datasets/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/publish-report.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push waits for the running one to finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create the Python environment from uv.lock
        run: uv sync --frozen

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render the site
        working-directory: docs
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
