[project]
name = "guinea-methodology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "earthengine-api>=1.7.48",
    "folium>=0.20.0",
    "geodatasets>=2026.5.1",
    "geopandas>=1.2.0",
