[project]
name = "guinea-methodology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "earthengine-api>=1.7.48",
    "folium>=0.20.0",
    "geemap>=0.38.9",
    "geodatasets>=2026.5.1",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "ipykernel>=7.4.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[project.scripts]
guinea-methodology = "guinea_methodology:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
